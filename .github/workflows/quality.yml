name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check archive tools
        run: command -v zip && command -v unzip
      - name: Test current downloads
        run: npm test
      - name: Rebuild downloadable archives
        run: npm run build
      - name: Test newly generated downloads
        run: npm test
      - name: Require generated assets to remain in sync
        run: git diff --exit-code -- docs/PROMPTS.md downloads/

  browser:
    name: Chromium browser and accessibility smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated browser testing tools
        run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run desktop and emulated Android browser tests
        run: node tests/browser-smoke.mjs
